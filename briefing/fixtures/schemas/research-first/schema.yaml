name: research-first
version: 1
description: Research before proposing
artifacts:
  - id: research
    generates: research.md
    template: research.md
    requires: []
  - id: proposal
    generates: proposal.md
    template: proposal.md
    requires:
      - research
  - id: tasks
    generates: tasks.md
    template: tasks.md
    requires:
      - proposal
apply:
  requires:
    - tasks
  tracks: tasks.md
